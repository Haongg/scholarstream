name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A throwaway Postgres per job for tests/test_metrics.py (run metrics are upserts, which only
# a real database can prove). The credentials only exist inside the job, so no secret needed.
# REQUIRE_POSTGRES makes those tests fail, not skip, if the service is not reachable.
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_DB: scholarstream
  REQUIRE_POSTGRES: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18  # same as docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: scholarstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d scholarstream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest

  # Airflow pins shared libraries (e.g. polars) through its constraints file, so the DAGs and
  # the whole suite also run in that environment: it is what the containers actually use.
  dags:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: scholarstream
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d scholarstream"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIRFLOW_VERSION: "3.3.2"
      PYTHON_VERSION: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Airflow with constraints
        run: >
          pip install -r requirements-airflow.txt -r requirements.txt
          -c https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt

      - name: Test (DAGs + pipeline under Airflow's pins)
        run: python -m pytest
