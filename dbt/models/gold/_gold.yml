version: 2

models:
  - name: fact_work_topics
    description: One row per (work, topic) of the quality-checked silver days.
    columns:
      - name: work_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_works'), field: work_id}}
      - name: topic_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_topics'), field: topic_id}}
      - name: publication_date
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: rank
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [1, 2, 3], quote: false}}
      - name: is_primary
        data_tests: [not_null]

  - name: dim_works
    description: One row per work (latest version across days); all work types.
    columns:
      - name: work_id
        data_tests: [unique, not_null]
      - name: publication_date
        data_tests: [not_null]
      - name: has_abstract
        description: About a quarter of works have no abstract; that is expected, not an error.
        data_tests: [not_null]

  - name: dim_topics
    description: One row per topic with its hierarchy (subfield, field, domain).
    columns:
      - name: topic_id
        data_tests: [unique, not_null]
      - name: topic_name
        data_tests: [not_null]
      - name: subfield_id
        data_tests: [not_null]
      - name: field_id
        data_tests: [not_null]
      - name: domain_id
        data_tests: [not_null]

  - name: dim_date
    description: Calendar from the first to the last publication date in gold.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_work_authors
    description: One row per author slot of a work (work_id, author_order), in byline order.
    columns:
      - name: work_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_works'), field: work_id}}
      - name: author_order
        data_tests: [not_null]
      - name: author_id
        description: Null for slots OpenAlex did not resolve to an author (~0.7%); kept so rows per work count its authors.
        data_tests:
          - relationships: {arguments: {to: ref('dim_authors'), field: author_id}}
      - name: publication_date
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: author_position
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [first, middle, last]}}

  - name: fact_authorship_institutions
    description: One row per (author slot, institution); bridge from fact_work_authors to dim_institutions.
    columns:
      - name: work_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_works'), field: work_id}}
      - name: author_order
        data_tests: [not_null]
      - name: institution_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_institutions'), field: institution_id}}
      - name: publication_date
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}

  - name: dim_authors
    description: One row per author (latest record across the checked days).
    columns:
      - name: author_id
        data_tests: [unique, not_null]
      - name: author_name
        data_tests: [not_null]

  - name: dim_institutions
    description: One row per institution (latest record across the checked days).
    columns:
      - name: institution_id
        data_tests: [unique, not_null]
      - name: institution_name
        data_tests: [not_null]
